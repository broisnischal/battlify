name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test (unit + benchmarks)
        # GitHub's runners ship full Xcode, so scripts/test.sh runs plain `swift test`.
        run: ./scripts/test.sh
